[package]
name = "particle-sim-3"
version = "0.1.0"
edition = "2024"

[profile.profiling]
inherits = "release"
debug = 1

[dependencies]
color-eyre = "0.6.5"
eframe = "0.36.1"
egui = { version = "0.36.1", features = ["rayon"] }
rand = "0.10.2"
rayon = "1.12.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
