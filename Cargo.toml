[package]
name = "particle-sim-3"
version = "0.1.0"
edition = "2024"

[profile.profiling]
inherits = "release"
debug = 1

[dependencies]
bitflags = "2.13.1"
color-eyre = "0.6.5"
eframe = "0.36.1"
egui = { version = "0.36.1", features = ["rayon"] }
# either = "1.18.0"
rayon = "1.12.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53.1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
] }
rand = "0.10.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.53.1", default-features = false, features = [
    "rt",
    "macros",
    "time",
    "sync",
] }
wasm-bindgen-futures = "0.4.79"
web-sys = "0.3.106"
rand = { version = "0.10.2", default-features = false }
